  bottom_px_per_mm: 17.9   # from U3 (ESOP-8: 3.81 mm pin 1 to 4, 3.9 mm body) and U2 (SOT-89: 4.5 mm body, 1.5 mm pitch); about ±5 %
  board_width_mm: null     # set to a measured width (outline's left-right extent) to override the scale
  bottom_x0: 51            # bottom-1 px of the outline's left edge
  bottom_y1: 1204          # bottom-1 px of the outline's bottom edge (the top view's top edge)
  thickness_mm: 1.6        # assumed (standard)
