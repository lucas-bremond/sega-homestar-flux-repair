# Partial electrical model of the Homestar Flux main board (E007-01GE047-02XP REV:00).
#
# This file is the single source of truth. build.py generates netlist.md,
# block-diagram.svg, pcb-model.kicad_sch and index.html from it. Edit this file,
# not the outputs, and re-run build.py.
#
# Every connection (a part pin on a net) carries a confidence level. A connection
# should only move to `measured` after a continuity or voltage check on the board.
# Pins not listed in any net are UNKNOWN, not unconnected.

board:
  name: Sega Toys Homestar Flux main board
  marking: "E007-01GE047-02XP REV:00 2018-07-05"
  model_date: "2026-11-07"

confidence:
  measured:
    rank: 5
    color: "#15803d"
    meaning: Checked on the board with a meter.
  confirmed:
    rank: 4
    color: "#2563eb"
    meaning: Silkscreen label, a wire seen soldered to the pad, or a measurement in REPAIR_LOG.md.
  photo:
    rank: 3
    color: "#7c3aed"
    meaning: Trace, copper area or tinned strip followed in a close-up photo.
  datasheet:
    rank: 2
    color: "#b45309"
    meaning: Pin function from the part's datasheet; the part number itself is read from the photo.
  assumed:
    rank: 1
    color: "#dc2626"
    meaning: Standard circuit practice or placement only. Treat as a hypothesis.

photos:
  top:
    file: photos/top-1.jpg
    size: [4032, 3024]
  bottom:
    file: photos/bottom-1.jpg
    size: [2016, 1512]

# kind: ic, transistor, diode, led, resistor, capacitor, electrolytic, inductor,
#       switch, pad (wire pad on the board edge)
# group: block in the block diagram. box: [x0, y0, x1, y1] in the photo's pixels.
