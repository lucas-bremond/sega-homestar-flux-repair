# Schematic layout. Parts listed here are placed by hand (offsets in mm from the block's
# column origin, optional `mirror` to put a pin on the other side); the rest of each block
# is stacked below. Wires are drawn only along `wires`, and build.py refuses a wire unless
# every pin on it is on the same net at `photo` confidence or better.
schematic_layout:
  input:
    width: 81.28
    place: { J_DCP: [0, 0, mirror], R1B: [20.32, 0], J_R1B: [40.64, 0] }
    wires:
      - [J_DCP.1, R1B.1]
      - [R1B.2, J_R1B.1]
  motor:
    width: 91.44
    place: { U4: [10.16, 15.24], C6: [35.56, 0], J_MP: [43.18, 10.16], J_MN: [55.88, 0], R13: [63.5, 17.78, mirror] }
    wires:
      - [U4.5, [30.48, 10.16]]
      - [[30.48, 10.16], J_MP.1]
      - [C6.1, [30.48, 10.16]]
      - [C6.2, J_MN.1]
      - [U4.8, R13.2]
  main_led:
    width: 71.12
    place: { J_5WLP: [0, 0, mirror], D16: [20.32, 0] }
    wires:
      - [J_5WLP.1, D16.1]

# Copper followed in the photos, for the 3D view's "Traced copper" layer. Points are pixels
# in the side's photo (top-1.jpg or bottom-1.jpg). Only segments actually seen are listed.
traces:
  - { net: M+, side: top, points: [[800, 1923], [870, 1985], [930, 2028]], evidence: "M+ pad to C6, enhanced parts/IMG_3619" }
  - { net: M+, side: top, points: [[965, 1950], [880, 1945], [800, 1923]], evidence: "U4 pin 5 to the M+ pad, parts/IMG_3619" }
  - { net: M-, side: top, points: [[1016, 2028], [1045, 2080], [1150, 2095], [1186, 2145]], evidence: "C6 to the M- pad along the board edge, enhanced parts/IMG_3619" }
  - { net: U4_OUTA, side: top, points: [[1105, 1950], [1065, 2019]], evidence: "U4 pin 8 to R13, parts/IMG_3619" }
  - { net: 5WL+, side: bottom, points: [[1255, 475], [1230, 505], [1210, 545]], evidence: "tinned strip from the 5WL+ lead to D16, parts/IMG_3628" }
  - { net: DC+, side: bottom, points: [[1635, 660], [1606, 662]], evidence: "DC+ copper to R1B, parts/IMG_3631" }
  - { net: R1B_IN, side: bottom, points: [[1546, 662], [1560, 590]], evidence: "R1B to the R1B pad's copper, parts/IMG_3631" }

# Each node is [part, pin, confidence, evidence].
nets:
  DC+:
    description: 5 V input from the USB cable, before the power switch.
    nodes:
      - [J_DCP, 1, confirmed, "Pad labelled DC+; red wire soldered (top-1, parts/IMG_3631)."]
      - [R1B, 1, photo, "R1B's pad sits on the DC+ copper area (parts/IMG_3631)."]
      - [S1, 1, assumed, "The slide switch is expected to be in series with the input; which pin is common is unknown."]
  R1B_IN:
    description: Third input wire, through 100 Ω into DC+.
    nodes:
      - [J_R1B, 1, confirmed, "Yellow wire soldered to the R1B pad (top-1, top-3; lead visible from the bottom in parts/IMG_3631)."]
      - [R1B, 2, photo, "R1B's other pad sits on the R1B pad's copper (parts/IMG_3631)."]
  GND:
    description: Ground return.
    nodes:
      - [J_DCN, 1, confirmed, "Pad labelled DC-; black wire soldered."]
      - [U4, 6, datasheet, "MX08L GND pin."]
      - [U4, 7, datasheet, "MX08L GND pin."]
      - [U2, 1, datasheet, "6206 SOT-89 pin 1 is VSS."]
      - [Q1, 2, assumed, "Low-side LED switch: emitter to ground."]
      - [C1, 2, assumed, "Regulator output capacitor to ground."]
      - [C8, 2, assumed, "Regulator input capacitor to ground."]
      - [C9, 2, assumed, "Supply decoupling next to U4 pin 4."]
      - [C7, 2, assumed, "Bulk capacitor near U4."]
  +5V:
    description: Supply after the power switch (assumed).
    nodes:
      - [S1, 2, assumed, "ON throw of the slide switch."]
      - [U2, 2, assumed, "The 3.3 V regulator is expected to run from the switched 5 V."]
      - [C8, 1, assumed, "U2 input capacitor (C8 sits at U2's input end, parts/IMG_3629)."]
      - [J_SSLP, 1, assumed, "Shooting-star LED anode on the supply; not traced."]
  +3V3:
    description: 3.3 V regulator output, probably the MCU supply.
    nodes:
      - [U2, 3, datasheet, "6206 SOT-89 pin 3 is VOUT."]
      - [C1, 1, assumed, "C1 sits against U2 pin 3 (parts/IMG_3629, parts/IMG_3630). Downgraded 2026-11-08: placement only, no trace followed."]
  U4_VDD:
    description: Motor driver power supply (pin 4). Its source is an open question.
    nodes:
      - [U4, 4, datasheet, "MX08L VDD (motor supply)."]
      - [C9, 1, assumed, "C9 sits against pin 4 (parts/IMG_3619). Downgraded 2026-11-08: placement only, no trace followed."]
      - [C7, 1, assumed, "REPAIR_LOG.md calls the 47 µF beside U4 its supply capacitor."]
  M+:
    description: Motor terminal +.
    nodes:
      - [J_MP, 1, confirmed, "Pad labelled M+."]
      - [U4, 5, photo, "Faint trace from pin 5 (OUTB) toward the M+ pad (parts/IMG_3619)."]
      - [C6, 1, photo, "Trace from C6's end to the M+ pad, seen in a contrast-enhanced parts/IMG_3619 (2026-11-08)."]
  M-:
    description: Motor terminal −.
    nodes:
      - [J_MN, 1, confirmed, "Pad labelled M-; black wire."]
      - [R13, 1, assumed, "R13 sits between the M- pad and U4 (parts/IMG_3619). Downgraded 2026-11-08: placement only, no trace followed."]
      - [C6, 2, photo, "Trace from the M- pad along the board edge to C6's other end, contrast-enhanced parts/IMG_3619 (2026-11-08)."]
  U4_OUTA:
    description: Motor driver output A, to M- through the 0 Ω link R13.
    nodes:
      - [U4, 8, photo, "Trace from R13 to pin 8 (OUTA) (parts/IMG_3619)."]
      - [R13, 2, photo, "Same trace."]
  SSL-:
    description: Shooting-star LED cathode, switched to ground by Q1.
    nodes:
      - [J_SSLN, 1, confirmed, "Pad labelled SSL-; brown wire."]
      - [R3, 1, assumed, "R3 (68 Ω) sits against the SSL- pad (parts/IMG_3632). Downgraded 2026-11-08: placement only, no trace followed."]
  Q1_C:
    description: Q1 collector, LED current through R3.
    nodes:
      - [R3, 2, assumed, "LED current limit resistor to the switch transistor."]
      - [Q1, 3, assumed, "SOT-23 pin 3 = collector."]
  Q1_B:
    description: Q1 base drive from the MCU.
    nodes:
      - [Q1, 1, assumed, "SOT-23 pin 1 = base."]
      - [R12, 2, assumed, "1 kΩ base resistor (placed between Q1 and U1)."]
      - [R17, 1, assumed, "10 kΩ base pull-down (placed next to R12)."]
  5WL+:
    description: 5 W LED anode side.
    nodes:
      - [J_5WLP, 1, confirmed, "Pad labelled 5WL+."]
      - [D16, 1, photo, "Tinned strip from the 5WL+ wire lead to D16's banded end (parts/IMG_3628)."]
  5WL-:
    description: 5 W LED cathode side.
    nodes:
      - [J_5WLN, 1, confirmed, "Pad labelled 5WL-; black wire."]
  ISENSE_A:
    description: LED-driver current-sense resistors, side A.
    nodes:
      - [R11, 1, assumed, "Two identical 0.39 Ω parts side by side: probably in parallel (0.195 Ω)."]
      - [R15, 1, assumed, "Same."]
  ISENSE_B:
    description: LED-driver current-sense resistors, side B.
    nodes:
      - [R11, 2, assumed, "Same as ISENSE_A."]
      - [R15, 2, assumed, "Same."]

# Pins whose net matters most for the fault, with the measurement that settles each.
open_questions:
  - id: OQ1
    title: Where does U4's motor supply (pin 4, VDD) come from?
    pins: [[U4, 4]]
    candidates: [+5V, DC+, a separate rail]
    check: "Power off: continuity from U4 pin 4 to DC+, to each S1 pin and to C3's + lead."
    why: The short that resets the unit flows from this supply when U4 is enabled.
  - id: OQ2
    title: Is U4's logic supply (pin 1, VCC) on 3.3 V or 5 V?
    pins: [[U4, 1]]
    candidates: [+3V3, +5V]
    check: "Unit on, idle (no button pressed): U4 pin 1 to GND. About 3.3 V means U2's output; about 5 V means the input."
    why: If VCC is on the 3.3 V rail, a fault in U4 pulls the MCU supply down directly.
  - id: OQ3
    title: Which U1 pins drive U4's inputs (pins 2 and 3)?
    pins: [[U4, 2], [U4, 3]]
    candidates: [U1 pins]
    check: "Power off: continuity from U4 pins 2 and 3 to each U1 pin."
    why: Lets you watch the drive signals on a scope while pressing a button.
  - id: OQ4
    title: Which slide-switch pin is common, and what does it feed?
    pins: [[S1, 1], [S1, 2], [S1, 3]]
    candidates: [DC+, +5V]
    check: "Power off, switch ON then OFF: continuity from DC+ to each S1 pin."
    why: Confirms the +5V rail exists as modelled.
  - id: OQ5
    title: What feeds the regulator input (U2 pin 2)?
    pins: [[U2, 2]]
    candidates: [+5V, DC+]
    check: "Power off: continuity from U2's tab to DC+ and to S1's ON pin."
    why: Completes the MCU supply path.
  - id: OQ6
    title: What is on the R1B (yellow) wire?
    pins: [[J_R1B, 1]]
    candidates: [USB data line, power LED, switch]
    check: "Trace the yellow wire inside the case to its other end."
    why: It feeds DC+ through 100 Ω; unusual for a plain 5 V input.
  - id: OQ7
    title: What does Q2 drive?
    pins: [[Q2, 1], [Q2, 2], [Q2, 3]]
    candidates: [unknown]
    check: "Power off: continuity from Q2's collector to SSL-, M+, M- and the front-panel LEDs; from its base, through its resistor, to U1's pins."
    why: Open question in REPAIR_LOG.md.
  - id: OQ8
    title: What are D10 and D11 (M1) for, next to U4?
    pins: [[D10, 1], [D10, 2], [D11, 1], [D11, 2]]
    candidates: [supply OR-ing, reverse protection, flyback]
    check: "Power off: diode test across each, then continuity from each end to U4 pins 1 and 4, DC+ and +5V."
    why: They sit on U4's side of the board and may be on its supply.

