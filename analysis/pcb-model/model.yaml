    label: R1B
    value: "unknown input"
    group: input
    pins: { 1: R1B }
    note: Yellow wire; its other end is not identified.
    box: { top: [3200, 1765, 3310, 1875], bottom: [1530, 555, 1665, 680] }
  J_MP:
    kind: pad
    wire: red
    label: M+
    value: "motor +"
